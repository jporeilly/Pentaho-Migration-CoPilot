# ---- transformation core ----
"tMap":
  pdi_type: ScriptValueMod
  confidence: review
  notes: "tMap combines joins, filters, and Java expressions in one component. Lookup inputs become Stream Lookups; output expressions translate Java -> JavaScript; inner-join reject flows need Filter rows."
"tFilterRow": { pdi_type: FilterRows, confidence: review, notes: "Conditions (or advanced-mode Java) need translation." }
"tAggregateRow": { pdi_type: GroupBy, confidence: auto, notes: "PDI Group By requires sorted input; insert a Sort rows step upstream." }
"tSortRow": { pdi_type: SortRows, confidence: auto }
"tJoin": { pdi_type: MergeJoin, confidence: review, notes: "Both inputs must be sorted on the join keys; verify join type and key mapping." }
"tUniqRow": { pdi_type: Unique, confidence: auto, notes: "PDI Unique rows requires sorted input." }
"tUnite": { pdi_type: Append, confidence: auto, notes: "Row layouts must match across all inputs." }
"tReplicate": { pdi_type: Dummy, confidence: review, notes: "PDI hops copy rows to multiple targets natively — set hop distribution to 'Copy' instead of a step." }
"tNormalize": { pdi_type: Normaliser, confidence: review }
"tDenormalize": { pdi_type: Denormaliser, confidence: review }
"tConvertType": { pdi_type: SelectValues, confidence: review, notes: "Recreate type conversions in Select values metadata tab." }
