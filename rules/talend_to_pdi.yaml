# equivalent - PDI is not a message-routing engine or a service host. Mapped to
# null (stays MANUAL) but WITH the reason, so the review list explains itself
# instead of printing a bare "no mapping rule". The route layer is rebuilt on a
# real integration platform; PDI is then called from it (Carte REST endpoint).
