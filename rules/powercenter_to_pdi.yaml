# Rules library: PowerCenter transformation type -> PDI step type (Stage 2: MAP).
# These are the "clean 70-80%" 1:1 equivalents. Anything not listed here falls
# through to LLM translation or manual handoff.
#
# pdi_type values are PDI step ids as they appear in .ktr XML <type> elements.
#
# Governance: bump _meta.version and record provenance whenever a rule is
# added or changed — the rules library is the product's accumulated knowledge.

_meta:
  version: 4
  updated: "2026-07-29"
  provenance:
    - "v1 (2026-07-17): initial 16 rules from PowerCenter documentation and PDI step inventory."
    - "v2 (2026-07-17): added 'Sequence' alias — real 10.x exports use TYPE=\"Sequence\", found by gap analysis on the HHS corpus."
    - "v3 (2026-07-17): added 'Stored Procedure' -> Call DB Procedure — 12 occurrences in the real corpus were unmapped."
    - "v4 (2026-07-29): added _suggestions — a transformation with no 1:1 rule now gets a SUGGESTED PDI approach, not a bare 'manual conversion required'. Same principle as Crystal->PRD: suggest a solution, flag for review, never just log the gap."

# A transformation TYPE with no rule above has no clean 1:1 PDI step - but it
# is NOT a dead end. Each entry here is the closest PDI approach, emitted as a
# suggestion the reviewer confirms (the step stays MANUAL). Keyed on the
# Informatica TRANSFORMATION TYPE exactly as it appears in the export.
_suggestions:
  "Custom Transformation": "a CUSTOM/in-house transformation - no rules library can cover it. Open it in the Designer to see what it does, then rebuild that behaviour with PDI steps (arbitrary logic fits a 'User Defined Java Class'; a reusable block fits a mapping/sub-transformation)."
  "Java Transformation": "a 'User Defined Java Class' step - port the Java in; simple per-row logic can instead go in a 'Modified Java Script Value'."
  "SQL": "an 'Execute row SQL script' step (one SQL per row) or 'Dynamic SQL row'; a query-mode SQL transformation often folds into the 'Table input' SQL."
  "Transaction Control": "PDI commits per transformation, not per row - set the commit size on the target step, or wrap the load in a job with a DB transaction. Review where the transaction boundaries must fall."
  "XML Parser": "a 'Get data from XML' step - XPath the incoming XML into fields."
  "XML Generator": "an 'Add XML' step - build the XML document from the incoming fields."
  "XML Source Qualifier": "a 'Get data from XML' step reading the source document."
  "Web Services Consumer": "a 'Web services lookup' step (SOAP) or a 'REST client' step (HTTP/JSON)."
  "HTTP": "an 'HTTP client' or 'REST client' step."
  "Data Masking": "no PDI data-masking step - mask in the source SQL, or with 'Modified Java Script Value' / 'Replace in string'. Review against the compliance rules."
  "Unstructured Data": "no direct PDI equivalent - parse the source with the step that matches its format ('Get data from XML', 'Regex evaluation', 'JSON input', or a script)."
  "Association": "an Informatica Data Quality step - approximate with 'Fuzzy match' + 'Group by'; review the association keys."
  "Match": "an Informatica Data Quality dedupe - approximate with 'Fuzzy match' then 'Unique rows', or 'Merge rows (diff)'. Review the match thresholds."
  "Address Validator": "an Informatica Data Quality step with no PDI equivalent - call an external address-validation service via 'REST client', or drop it if the estate does not need it."
  "Mapplet": "a reusable Informatica mapplet - convert it to a PDI mapping (sub-transformation) and call it with a 'Mapping (sub-transformation)' step so the reuse is preserved."
  "Input Transformation": "a mapplet's INPUT port - when the mapplet becomes a PDI sub-transformation this becomes its 'Mapping input specification' step; no standalone conversion needed."
  "Output Transformation": "a mapplet's OUTPUT port - when the mapplet becomes a PDI sub-transformation this becomes its 'Mapping output specification' step; no standalone conversion needed."

"Source Qualifier":
  pdi_type: TableInput
  confidence: auto
  notes: SQL override, if present, must be reviewed for dialect differences.

"Expression":
  pdi_type: ScriptValueMod          # Modified Java Script Value; simple cases may fit Calculator
  confidence: review
  notes: Port expressions require translation from Informatica expression language.

"Aggregator":
  pdi_type: GroupBy
  confidence: auto
  notes: PDI Group By requires sorted input; a Sort rows step is inserted upstream.

"Sorter":
  pdi_type: SortRows
  confidence: auto

"Filter":
  pdi_type: FilterRows
  confidence: review
  notes: Filter condition requires expression translation.

"Router":
  pdi_type: SwitchCase
  confidence: review
  notes: Multiple output groups map to Switch/Case targets; conditions need translation.

"Joiner":
  pdi_type: MergeJoin
  confidence: auto
  notes: PDI Merge Join requires both inputs sorted on join keys.

"Lookup Procedure":
  pdi_type: StreamLookup
  confidence: auto
  notes: Connected lookups only; unconnected lookups need restructuring (manual).

"Sequence Generator":
  pdi_type: Sequence
  confidence: auto

# Real 10.x exports use TYPE="Sequence" (found via gap analysis on the HHS corpus).
"Sequence":
  pdi_type: Sequence
  confidence: auto

"Union Transformation":
  pdi_type: Append
  confidence: auto

"Rank":
  pdi_type: SortRows
  confidence: review
  notes: Emulated as Sort rows + Sample rows; verify tie-handling semantics.

"Update Strategy":
  pdi_type: InsertUpdate
  confidence: review
  notes: DD_INSERT/DD_UPDATE/DD_DELETE flags map to Insert/Update or Delete steps.

"Normalizer":
  pdi_type: Normaliser
  confidence: review

"Stored Procedure":
  pdi_type: DBProc
  confidence: review
  notes: Call DB Procedure runs per row; verify parameter directions (IN/OUT), return values, and whether the original ran pre/post-session instead of per row.

"Target Definition":
  pdi_type: TableOutput
  confidence: auto

"Source":
  pdi_type: TableInput
  confidence: auto

"Target":
  pdi_type: TableOutput
  confidence: auto
