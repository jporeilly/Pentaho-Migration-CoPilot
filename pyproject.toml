[project]
name = "pdi-migration"
version = "0.5.1"
description = "Migration Copilot - AI-assisted migration of legacy ETL (Informatica, SSIS, Talend, DataStage) into Pentaho Data Integration"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "typer>=0.12",
    "pyyaml>=6.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn[standard]>=0.29", "python-multipart>=0.0.9"]
llm = ["anthropic>=0.40"]
dev = ["pytest>=8.0", "httpx>=0.27"]

[project.scripts]
pdi-migrate = "pdi_migration.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pdi_migration = ["api/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
