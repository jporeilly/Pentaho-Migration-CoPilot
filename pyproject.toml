[project]
name = "pentaho-migration"
version = "1.31.0"
description = "Migration Copilot - AI-assisted migration of legacy ETL (Informatica, SSIS, Talend, DataStage) into Pentaho Data Integration"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "typer>=0.12",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "fpdf2>=2.8",
    "pillow>=10.0",   # image carving from .rpt binaries (reports/rpt_images.py)
]

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn[standard]>=0.29", "python-multipart>=0.0.9"]
llm = ["anthropic>=0.40", "openai>=1.40"]   # cloud providers (Google/Azure use the openai SDK)
schema = ["psycopg2-binary>=2.9"]   # schema-aware SQL agent (PostgreSQL targets)
dev = ["pytest>=8.0", "httpx>=0.27"]

[project.scripts]
pentaho-migrate = "pentaho_migration.cli:app"
pdi-migrate = "pentaho_migration.cli:app"  # legacy alias

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pentaho_migration = ["api/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
